<!-- src/main/resources/templates/index.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FreeFlix</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #0b0f19; color: #e6e6e6; }
    header { padding: 16px; display: flex; justify-content: space-between; align-items: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; padding: 16px; }
    .card { background: #141a2a; border-radius: 12px; overflow: hidden; }
    .card img { width: 100%; height: 260px; object-fit: cover; }
    .card h3 { margin: 8px 12px; font-size: 16px; }
  </style>
</head>
<body>
<header>
  <h1>FreeFlix</h1>
  <div>Movies without limits</div>
</header>
<main>
  <section class="grid" id="latest"></section>
</main>
<script>
  async function loadLatest() {
    const res = await fetch('/movies/latest');
    const movies = await res.json();
    const grid = document.getElementById('latest');
    grid.innerHTML = movies.map(m => `
      <div class="card">
        <img src="${m.posterUrl}" alt="${m.title}">
        <h3>${m.title}</h3>
        <button onclick="play('${m.id}')">Play</button>
      </div>
    `).join('');
  }
  async function play(id) {
    const res = await fetch(`/stream/${id}/session`);
    const session = await res.json();
    // Use hls.js to play session.moviePlaylist and stitch preroll/midroll/postroll
    alert('Start playback: ' + session.moviePlaylist);
  }
  loadLatest();
</script>
</body>
</html>
